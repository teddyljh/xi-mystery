name: Embed new reaction images in XI Mystery
on:
  push:
    branches: [main]
    paths:
      - 'reaction_photos/**'
      - 'scripts/sync_reactions.py'
      - 'scripts/upgrade_hard.py'
      - 'scripts/test_hard_mode.cjs'
      - 'scripts/upgrade_easy.py'
      - 'scripts/easy_choices.js'
      - 'scripts/test_easy_mode.cjs'
      - 'scripts/report_hard_nations.cjs'
      - 'scripts/sync_ucl_finals.py'
      - 'scripts/test_ucl_finals.cjs'
      - 'data/ucl_finals.json'
      - 'scripts/sync_national_finals.py'
      - 'scripts/test_national_finals.cjs'
      - 'data/national_finals.json'
      - '.github/workflows/sync-reactions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update embedded reaction gallery
        run: python3 scripts/sync_reactions.py
      - name: Synchronize verified Champions League finals
        run: python3 scripts/sync_ucl_finals.py
      - name: Synchronize World Cup and EURO finals
        run: python3 scripts/sync_national_finals.py
      - name: Add historic and powerhouse XIs to Hard mode
        run: python3 scripts/upgrade_hard.py
      - name: Refresh Easy and Moderate choices
        run: python3 scripts/upgrade_easy.py
      - name: Check generated quiz JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          marker = '/* XI Mystery — client-only, offline-capable quiz engine. */'
          start = source.index(marker)
          end = source.index('</script>', start)
          assert 'function isImportedHardFixture(f)' in source[start:end]
          Path('/tmp/xi-quiz-engine.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/xi-quiz-engine.js
      - name: Check Hard masks and hint behavior
        run: node scripts/test_hard_mode.cjs
      - name: Check Easy pool and distractor constraints
        run: node scripts/test_easy_mode.cjs
      - name: Check final catalog and difficulty coverage
        run: node scripts/test_ucl_finals.cjs
      - name: Check national final catalog and competition-free prompts
        run: node scripts/test_national_finals.cjs
      - name: Refresh national-team Hard review
        run: |
          mkdir -p docs
          node scripts/report_hard_nations.cjs > docs/hard-national-team-masks.md
      - name: Commit generated index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/hard-national-team-masks.md docs/ucl-finals-2002-2026.md docs/national-finals-2002-2026.md
          if ! git diff --cached --quiet; then
            git commit -m "Embed new score-tier reaction images in game [skip ci]"
            git push origin HEAD:main
          fi

