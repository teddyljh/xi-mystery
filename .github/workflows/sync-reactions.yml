name: Embed new reaction images in XI Mystery
on:
  push:
    branches: [main]
    paths:
      - 'reaction_photos/**'
      - 'scripts/sync_reactions.py'
      - 'scripts/upgrade_hard.py'
      - '.github/workflows/sync-reactions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update embedded reaction gallery
        run: python3 scripts/sync_reactions.py
      - name: Add historic and powerhouse XIs to Hard mode
        run: python3 scripts/upgrade_hard.py
      - name: Check generated quiz JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          marker = '/* XI Mystery — client-only, offline-capable quiz engine. */'
          start = source.index(marker)
          end = source.index('</script>', start)
          assert 'function isImportedHardFixture(f)' in source[start:end]
          Path('/tmp/xi-quiz-engine.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/xi-quiz-engine.js
      - name: Commit generated index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Embed new score-tier reaction images in game [skip ci]"
            git push origin HEAD:main
          fi

