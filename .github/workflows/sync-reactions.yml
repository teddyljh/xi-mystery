name: Embed new reaction images in XI Mystery
on:
  push:
    branches: [main]
    paths:
      - 'reaction_photos/**'
      - 'scripts/sync_reactions.py'
      - '.github/workflows/sync-reactions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update embedded reaction gallery
        run: python3 scripts/sync_reactions.py
      - name: Commit generated index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Embed new score-tier reaction images in game [skip ci]"
            git push origin HEAD:main
          fi

