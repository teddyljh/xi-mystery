<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XI Mystery · Reaction Gallery</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#091a19;color:#e8f5ee}*{box-sizing:border-box}body{margin:0}a{color:#a9e6c0}button,input{font:inherit}button{cursor:pointer}main{max-width:1220px;margin:auto;padding:34px 20px 80px}h1{font-size:clamp(26px,4vw,42px);margin:10px 0}p{color:#aac8b9;line-height:1.55}.nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.nav a{border:1px solid #39654d;padding:8px 13px;border-radius:10px;text-decoration:none}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:19px 0}.pill{background:#193a32;border:1px solid #365a4d;border-radius:99px;padding:7px 12px;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{background:#18362e;border:1px solid #3c6953;border-radius:10px;color:#d9f1e2;padding:10px 13px}.filter.active{background:#9ce7af;color:#0d3022;border-color:#9ce7af}.search{flex:1;min-width:170px;background:#152e2c;color:#fff;border:1px solid #456b5c;border-radius:10px;padding:10px 13px}.group{margin-top:32px}.group[hidden],.tile[hidden]{display:none!important}.group header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #39574a;margin-bottom:15px}.group h2{font-size:23px;margin:0 0 10px}.group strong{font-size:13px;color:#b9dfc5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.tile{border:1px solid #31594b;border-radius:13px;overflow:hidden;background:#122b26;min-width:0}.picture{height:210px;position:relative;background:#233f35;display:flex;align-items:center;justify-content:center;cursor:zoom-in}.picture img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.picture.broken img{display:none}.picture.broken:after{content:'图片需要联网 · 点击下方来源链接';text-align:center;font-size:13px;color:#e4ddcb;padding:15px}.info{padding:12px}.line{display:flex;gap:8px;align-items:center;color:#a4c2af;font-size:12px}.id{background:#83dca5;color:#153427;padding:3px 6px;border-radius:5px}.info h3{font-size:16px;margin:12px 0 7px}.filename{font:12px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9cb2a6}.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:13px}.mark{background:#23463a;border:1px solid #42765b;color:#e5f5eb;padding:7px 9px;border-radius:7px;font-size:12px}.mark.on{background:#d9ae64;color:#2c240c}.status{font-size:10px;color:#9fb7ab}.status.local{color:#a0edb5}.source{font-size:11px;display:block;margin-top:10px}.markbar{position:sticky;z-index:10;top:0;background:#102b27;border:1px solid #355b4c;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.markbar span{flex:1}.markbar button{border:0;border-radius:8px;background:#9ce7af;color:#08281a;padding:9px 13px;font-weight:700}dialog{max-width:min(97vw,1000px);max-height:96vh;background:#0c1819;color:white;border:1px solid #416b55;border-radius:14px;padding:12px}dialog::backdrop{background:#000d}dialog img{display:block;max-width:100%;max-height:78vh;object-fit:contain;margin:auto}.dlgfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.dlgfoot button{background:#224434;color:#fff;border:1px solid #668674;border-radius:7px;padding:8px 13px}#error{color:#ffb4a2}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){main{padding:20px 12px 64px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.picture{height:165px}.info{padding:10px}.info h3{font-size:14px}}
</style></head><body><main>
<div class="nav"><a href="./">← 返回 XI Mystery 游戏</a><span>官方结算图片数据库预览</span></div><h1>⚽ XI Mystery · 表情包图鉴</h1><p>直接读取当前游戏 <code>index.html</code> 内的全部结算图片。按照最终分数分档；支持筛选、搜索、放大和标记待替换图片。新增图片随游戏版本自动同步。</p>
<div class="summary" id="summary">正在读取图片库…</div>
<div class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="perfect">🏆 500</button><button class="filter" data-filter="high">🎉 400–499</button><button class="filter" data-filter="mid">🧐 200–399</button><button class="filter" data-filter="low">😭 0–199</button><input id="search" class="search" type="search" placeholder="搜索球星、文件名或编号" aria-label="搜索图片"></div>
<div class="markbar"><span id="selected">未标记替换图片</span><button id="copy">复制待替换编号</button><button id="clear" style="background:#29483d;color:#e3eee6">清空</button></div>
<div id="groups"></div><p id="error" role="alert"></p>
<dialog id="preview"><img id="zoom" alt=""><div class="dlgfoot"><span id="zoom-title"></span><button id="close">关闭 ✕</button></div></dialog>
</main><script>
(async()=>{'use strict';
const $=id=>document.getElementById(id), html=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const scoreLabels={perfect:'500 满分',high:'400–499',mid:'200–399',low:'0–199'};
const tierHeaders={perfect:'🏆 500 满分',high:'🎉 400–499',mid:'🧐 200–399',low:'😭 0–199'};
const selected=new Set();let filter='all',tiles=[];
function parsePayload(src,prefix,suffix){const begin=src.indexOf(prefix);if(begin<0)throw Error('图片数据库缺少：'+prefix);const end=src.indexOf(suffix,begin+prefix.length);if(end<0)throw Error('未找到图片数据库结束标记');return JSON.parse(src.slice(begin+prefix.length,end));}
const fileURL=name=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(name)+'?width=650';
function updateSelection(){$('selected').textContent=selected.size?'待替换 '+selected.size+' 张：'+[...selected].sort().join(', '):'未标记替换图片';}
function refresh(){let shown=0;const q=$('search').value.trim().toLowerCase();for(const tile of tiles){const yes=(filter==='all'||tile.dataset.tier===filter)&&(!q||tile.dataset.search.includes(q));tile.hidden=!yes;if(yes)shown++;}for(const group of document.querySelectorAll('.group'))group.hidden=![...group.querySelectorAll('.tile')].some(t=>!t.hidden);$('error').textContent=shown?'':'没有符合筛选条件的图片';}
try{
 const response=await fetch('./index.html',{cache:'no-store'});if(!response.ok)throw Error('无法读取游戏文件（HTTP '+response.status+'）');const src=await response.text();
 const images=parsePayload(src,'window.XI_REACTION_IMAGES = ',';\n\n');
 const reactions=parsePayload(src,'const FINISH_REACTIONS=',';\nfunction translateKey');
 let total=0,local=0;
 for(const tier of ['perfect','high','mid','low']){
  const bucket=reactions[tier];if(!bucket)continue;const section=document.createElement('section');section.className='group';section.dataset.tier=tier;const items=bucket.items||[];total+=items.length;
  section.innerHTML='<header><h2>'+tierHeaders[tier]+'</h2><strong>'+items.length+' 张</strong></header><div class="grid"></div>';
  const grid=section.querySelector('.grid');
  for(const item of items){const embedded=item.local&&images[item.local];if(embedded)local++;const label=item.label?.zh||item.label?.en||item.file||item.id;const url=embedded||fileURL(item.file);const download=embedded?'download="'+html(item.local)+'"':'';
   const tile=document.createElement('article');tile.className='tile';tile.dataset.tier=tier;tile.dataset.search=(label+' '+(item.file||'')+' '+item.id).toLowerCase();tile.innerHTML='<div class="picture" role="button" tabindex="0" aria-label="放大图片 '+html(item.id)+'"><img loading="lazy" decoding="async" src="'+html(url)+'" alt="'+html(label)+'"></div><div class="info"><div class="line"><b class="id">'+html(item.id)+'</b><span>'+scoreLabels[tier]+' 分</span></div><h3>'+html(label)+'</h3><div class="filename" title="'+html(item.file)+'">'+html(item.file)+'</div><div class="actions"><button class="mark" aria-pressed="false">＋ 标记替换</button><span class="status '+(embedded?'local':'')+'">'+(embedded?'已内置 · 离线可看':'外部图片 · 需要联网')+'</span></div>'+(embedded?'<a class="source" '+download+' href="'+html(url)+'">查看 / 保存原图</a>':'<a class="source" target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(item.file)+'">查看原图与授权</a>')+'</div>';
   const image=tile.querySelector('img');image.addEventListener('error',()=>tile.querySelector('.picture').classList.add('broken'));
   const open=()=>{if(image.naturalWidth===0)return;const dlg=$('preview');$('zoom').src=image.src;$('zoom').alt=image.alt;$('zoom-title').textContent=item.id+' · '+label;dlg.showModal();};
   const picture=tile.querySelector('.picture');picture.addEventListener('click',open);picture.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
   const mark=tile.querySelector('.mark');mark.addEventListener('click',()=>{selected.has(item.id)?selected.delete(item.id):selected.add(item.id);mark.classList.toggle('on',selected.has(item.id));mark.setAttribute('aria-pressed',selected.has(item.id)?'true':'false');mark.textContent=selected.has(item.id)?'✓ 已标记':'＋ 标记替换';updateSelection();});grid.append(tile);tiles.push(tile);
  }$('groups').append(section);
 }
 $('summary').innerHTML='<span class="pill">数据库：<b>'+total+' 张</b></span><span class="pill">用户上传（已内置）：<b>'+local+' 张</b></span><span class="pill">在线来源：<b>'+(total-local)+' 张</b></span><span class="pill">4 个分数档</span>';
 for(const button of document.querySelectorAll('.filter')){const tier=button.dataset.filter;const cnt=tier==='all'?total:(reactions[tier]?.items||[]).length;button.textContent=button.textContent.replace(/（\d+）$/,'')+'（'+cnt+'）';}
 refresh();
}catch(error){$('summary').textContent='图片库读取失败';$('error').textContent=error.message+'。请通过 GitHub Pages 网站访问本页，直接打开本地文件可能受到浏览器跨文件访问限制。';console.error(error);}
 document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(el=>el.classList.toggle('active',el===b));refresh();}));
 $('search').addEventListener('input',refresh);$('close').addEventListener('click',()=>$('preview').close());$('preview').addEventListener('click',e=>{if(e.target===$('preview'))$('preview').close();});
 $('copy').addEventListener('click',async()=>{const value=[...selected].sort().join(', ');if(!value){$('selected').textContent='请先标记需要替换的图片';return;}try{await navigator.clipboard.writeText(value);$('selected').textContent='已复制：'+value;}catch(_){$('selected').textContent='需要手动复制：'+value;}});$('clear').addEventListener('click',()=>{selected.clear();document.querySelectorAll('.mark').forEach(b=>{b.classList.remove('on');b.textContent='＋ 标记替换';b.setAttribute('aria-pressed','false');});updateSelection();});
})();
</script></body></html>
